name: Tests and coverage

on: [push, pull_request]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup utilities
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest coverage codecov
    - name: Install Spektral
      run: |
        # TensorFlow below 2.15 (test_global_node_attention_pool fails on 2.15), and the scipy and networkx
        # this code still runs on: scipy 1.11 removed errstate and Delaunay.vertices; networkx 3
        # returns csr_array. On macOS arm64, pyproject installs tensorflow-macos instead.
        python -m pip install "tensorflow<2.15; sys_platform != 'darwin'" "tensorflow-macos<2.15; sys_platform == 'darwin'" "scipy<1.11" "networkx<3" .
    - name: Test with pytest and coverage
      run: |
        python -m coverage run --source=. -m pytest
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v1
